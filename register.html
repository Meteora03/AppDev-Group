<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <style>
        /* -------- General Styles -------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #e6f4ff;
            color: #033b5c;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* -------- Header -------- */
        header {
            background-color: #b3ddff;
            padding: 20px 40px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            font-weight: bold;
            color: #033b5c;
        }

        /* -------- Main Container -------- */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .container h1 {
            font-size: 28px;
            color: #034f84;
            margin-bottom: 30px;
        }

        /* -------- Input Fields -------- */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            font-size: 16px;
            border: 2px solid #b3ddff;
            border-radius: 6px;
            background-color: #f9fcfe;
            color: #033b5c;
            transition: 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #4da6ff;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(77, 166, 255, 0.1);
        }

        /* -------- Buttons -------- */
        button {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            background-color: #4da6ff;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #1a8cff;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(26, 140, 255, 0.3);
        }

        /* -------- Message -------- */
        #message {
            font-size: 14px;
            margin-bottom: 20px;
            min-height: 20px;
        }

        #message.success {
            color: #28a745;
        }

        #message.error {
            color: #dc3545;
        }

        /* -------- Link -------- */
        .link {
            color: #4da6ff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .link:hover {
            color: #1a8cff;
        }

        /* -------- Footer -------- */
        footer {
            background-color: #b3ddff;
            text-align: center;
            padding: 20px;
            color: #033b5c;
            font-weight: 500;
            margin-top: auto;
        }
    </style>

    <script src="encryption.js" defer></script>
    <script src="register.js" defer></script>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>MyTime - Register</h1>
    </header>

    <!-- Main Content -->
    <div class="main-content">
        <div class="container">
            <h1>Register</h1>

            <input type="text" id="regUser" placeholder="Username">
            <input type="password" id="regPass" placeholder="Password (min 8 chars)">
            <button id="registerBtn">Register</button>

            <p id="message"></p>

            <a class="link" href="login.html">Already have an account?</a>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 MyTime. All rights reserved.</p>
    </footer>

</body>
</html>
